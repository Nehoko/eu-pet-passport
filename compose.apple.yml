name: petpass-personal

services:
  app:
    # container-compose does not expand variables inside image references.
    image: ghcr.io/nehoko/eu-pet-passport:2.0.0-personal.0
    user: "65532:65532"
    read_only: true
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_DB_PATH: /data/petpass.db
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
      APP_COUNTRY_CODE: ${APP_COUNTRY_CODE:-DE}
    volumes:
      - petpass_personal_data:/data
    healthcheck:
      test: ["CMD", "/app/petpass", "healthcheck", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  petpass_personal_data:
