name: petpass-personal

services:
  app:
    image: ghcr.io/nehoko/eu-pet-passport:${APP_VERSION:-2.0.0-personal.0}
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_DB_PATH: /data/petpass.db
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
      APP_COUNTRY_CODE: ${APP_COUNTRY_CODE:-DE}
    volumes:
      - petpass_personal_data:/data
    healthcheck:
      test: ["CMD", "/app/petpass", "healthcheck", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  petpass_personal_data:
