name: petpass-eu

services:
  app:
    image: ghcr.io/nehoko/eu-pet-passport:${APP_VERSION:-latest}
    init: true
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_DB_PATH: /data/petpass.db
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      APP_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      APP_MEMBER_STATE: ${APP_MEMBER_STATE:-Member State}
      APP_COUNTRY_CODE: ${APP_COUNTRY_CODE:-DE}
    secrets:
      - admin_password
    volumes:
      - petpass_data:/data
    healthcheck:
      test: ["CMD", "/app/petpass", "healthcheck", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

secrets:
  admin_password:
    file: ${APP_ADMIN_PASSWORD_FILE:-./secrets/admin_password.txt}

volumes:
  petpass_data:
